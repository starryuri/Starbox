<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARBOX 卸载</title>
<style>
  :root{--bg:#0c1020;--panel:#141a2e;--panel2:#1b2340;--border:#283050;--accent:#22d3ee;--accent2:#8b5cf6;--lime:#a3e635;--amber:#f59e0b;--red:#f87171;--text:#e7ecf7;--muted:#93a0bd}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .card{width:620px;max-width:94vw;background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden}
  .hd{display:flex;align-items:center;gap:14px;padding:22px 28px;background:linear-gradient(120deg,rgba(245,158,11,.20),rgba(248,113,113,.16));border-bottom:1px solid var(--border)}
  .logo{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--amber),var(--red));color:#1a1205;font-weight:800;font-size:22px;box-shadow:0 0 22px rgba(245,158,11,.4)}
  .hd .tt{font-size:19px;font-weight:800;letter-spacing:.4px;line-height:1.1}
  .hd .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .mode{margin-left:auto;font-size:12px;font-weight:700;padding:5px 14px;border-radius:200px;background:rgba(255,255,255,.10);color:var(--text);border:1px solid var(--border)}
  main{padding:30px 36px 32px}
  h2{font-size:18px;margin:0 0 6px;font-weight:700}
  .muted{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 16px}
  .center{text-align:center}
  .big-ic{font-size:48px;line-height:1;margin-bottom:10px}
  .warn-ic{color:var(--amber)}
  .ok-ic{color:var(--lime)}
  .pathbox{margin-top:16px;padding:13px 15px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);font-size:12.5px;color:var(--muted);word-break:break-all}
  .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
  button{padding:11px 24px;border-radius:10px;border:none;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  button:disabled{opacity:.5;cursor:not-allowed}
  .danger{background:linear-gradient(135deg,var(--red),#b91c1c);color:#fff}
  .danger:hover{filter:brightness(1.08)}
  .ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .ghost:hover{background:var(--panel2)}
  .primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b0e17}
  .primary:hover{filter:brightness(1.1)}
  .status{font-size:12.5px;min-height:18px;margin-top:14px;color:var(--muted)}
  .status.err{color:var(--red)}
</style>
</head>
<body>
<div class="card">
  <header class="hd">
    <div class="logo">&#10022;</div>
    <div><div class="tt">STARBOX 星匣</div><div class="sub">你的次元 · 收于一匣</div></div>
    <div class="mode">卸载</div>
  </header>
  <main>
    <section id="stepConfirm">
      <div class="center"><div class="big-ic warn-ic">&#9888;</div></div>
      <h2 class="center">卸载 STARBOX</h2>
      <p class="muted center">将删除安装目录、快捷方式与卸载注册表项。此操作不可撤销，确定继续吗？</p>
      <div class="pathbox" id="dirPath"></div>
      <div class="foot">
        <button class="ghost" id="cancel">取消</button>
        <button class="danger" id="uniGo">卸载</button>
      </div>
      <div id="status" class="status"></div>
    </section>
    <section id="stepDone" hidden>
      <div class="center"><div class="big-ic ok-ic">&#10004;</div></div>
      <h2 class="center">已卸载</h2>
      <p class="muted center">STARBOX 已从本机移除，相关文件已清理。</p>
      <div class="foot">
        <button class="primary" id="done">完成</button>
      </div>
    </section>
  </main>
</div>
<script>
const $=id=>document.getElementById(id);
function statusSet(txt,cls){const e=$('status');if(e){e.textContent=txt;e.className='status '+(cls||'');}}
async function boot(){try{const st=await (await fetch('/state')).json();if(st&&st.dir)$('dirPath').textContent='安装位置：'+st.dir;}catch(e){}}
$('uniGo').onclick=async()=>{
  const btn=$('uniGo');btn.disabled=true;
  statusSet('正在卸载…','');
  try{await fetch('/uninstall',{method:'POST'});}catch(e){}
  $('stepConfirm').hidden=true;$('stepDone').hidden=false;
};
$('cancel').onclick=()=>window.close();
$('done').onclick=()=>window.close();
boot();
</script>
</body>
</html>
